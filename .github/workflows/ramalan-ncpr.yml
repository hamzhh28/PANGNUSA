name: Ramalan NCPR

# Menghitung ulang ramalan NCPR dan memperbarui pangnusa-frontend/public/ncpr_2027.json setiap kali dataset di-push, atau dijalankan manual dari tab Actions.
# Model tidak dilatih ulang di sini (MUAT_BOBOT=1): bobot run Colab resmi di pangnusa-backend/hasil/ yang dipakai, supaya angkanya sama dengan Colab. Melatih ulang dilakukan di Colab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pangnusa-backend/dataset_gabungan_kabupaten.csv

permissions:
  contents: write

concurrency: ramalan-ncpr

jobs:
  ramal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pangnusa-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install library
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pandas==2.3.3 numpy==2.2.6 scikit-learn==1.7.2 matplotlib==3.10.8 ipykernel==7.3.0 nbconvert

      # Notebook hasil eksekusi disimpan di /tmp, jadi notebook di repo (versi Colab) tidak berubah
      - name: Jalankan notebook dengan bobot resmi
        env:
          MUAT_BOBOT: "1"
        run: >
          jupyter nbconvert --to notebook --execute --output-dir /tmp
          --ExecutePreprocessor.timeout=-1 --ExecutePreprocessor.kernel_name=python3
          Kelompok_6_FT_Transformer_v2.ipynb

      # Push dari GITHUB_TOKEN tidak memicu workflow lagi, jadi tidak terjadi loop
      - name: Simpan ncpr_2027.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../pangnusa-frontend/public/ncpr_2027.json
          git diff --cached --quiet || git commit -m "Perbarui ncpr_2027.json (GitHub Actions)"
          git push
